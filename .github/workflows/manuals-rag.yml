name: manuals-rag

on:
  push:
    branches: [main]
    paths:
      - "06-manuals-rag/**"
      - ".github/workflows/manuals-rag.yml"
  pull_request:
    paths:
      - "06-manuals-rag/**"
  workflow_dispatch:
    inputs:
      action:
        description: "apply = build + deploy + index + evaluate; evaluate = re-run the question set only"
        type: choice
        options: [plan, apply, evaluate, destroy]
        default: plan

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: 06-manuals-rag

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    # ARM runner builds the ARM image natively, matching the arm64 Lambdas (as in project 04).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency: manuals-rag-deploy
    env:
      ACTION: ${{ inputs.action || 'plan' }}
      REPO_NAME: manuals-rag
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Use the commit as the image tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform validate

      - name: terraform plan
        if: env.ACTION == 'plan'
        run: terraform plan -input=false -var "image_tag=$TAG"

      # Lambda can only be created once its image exists, so the repository comes first.
      - name: Create the image repository
        if: env.ACTION == 'apply'
        run: |
          terraform apply -auto-approve -input=false -var "image_tag=$TAG" \
            -target=aws_ecr_repository.rag \
            -target=aws_ecr_repository_policy.lambda_pull \
            -target=aws_ecr_lifecycle_policy.rag

      - name: Build the image and push it to ECR
        if: env.ACTION == 'apply'
        run: |
          REPO=$(aws ecr describe-repositories --repository-names "$REPO_NAME" \
            --query 'repositories[0].repositoryUri' --output text)
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already in ECR; skipping the build."
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build --provenance=false -t "$REPO:$TAG" .
          docker push "$REPO:$TAG"

      - name: Deploy the functions, bucket and API
        if: env.ACTION == 'apply'
        run: terraform apply -auto-approve -input=false -var "image_tag=$TAG"

      - name: Pass Terraform outputs on
        if: env.ACTION == 'apply' || env.ACTION == 'evaluate'
        run: |
          echo "BUCKET=$(terraform output -raw bucket)" >> "$GITHUB_ENV"
          echo "API_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"
          KEY=$(terraform output -raw api_key)
          echo "::add-mask::$KEY"
          echo "API_KEY=$KEY" >> "$GITHUB_ENV"

      # Uploading manuals triggers the indexer Lambda through an S3 event; then wait for it.
      - name: Upload the manuals (starts the indexer)
        if: env.ACTION == 'apply'
        run: |
          aws s3 sync manuals/ "s3://$BUCKET/manuals/" --delete
          python eval/wait_for_index.py

      - name: Evaluate against the question set
        if: env.ACTION == 'apply' || env.ACTION == 'evaluate'
        run: python eval/run_eval.py

      - name: terraform destroy
        if: env.ACTION == 'destroy'
        run: terraform destroy -auto-approve -input=false -var "image_tag=$TAG"
