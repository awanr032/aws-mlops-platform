name: defect-data-lake

on:
  push:
    branches: [main]
    paths:
      - "08-defect-data-lake/**"
      - ".github/workflows/defect-data-lake.yml"
  pull_request:
    paths:
      - "08-defect-data-lake/**"
  workflow_dispatch:
    inputs:
      action:
        description: "all = apply → ingest → elt → etl → analyse. Or run one stage at a time."
        type: choice
        options: [plan, apply, ingest, elt, etl, analyse, all, destroy]
        default: plan

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: 08-defect-data-lake

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as AWS Glue 5.0
      - uses: actions/setup-java@v4 # Spark needs Java
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  run:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: defect-data-lake
    env:
      ACTION: ${{ inputs.action || 'plan' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          role-duration-seconds: 3600

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform validate

      - name: terraform plan
        if: env.ACTION == 'plan'
        run: terraform plan -input=false

      - name: terraform apply (bucket, Glue catalog/job/crawler, Athena workgroup)
        if: env.ACTION == 'apply' || env.ACTION == 'all'
        run: terraform apply -auto-approve -input=false

      - name: Read settings for the pipeline scripts
        if: contains(fromJSON('["ingest","elt","etl","analyse","all"]'), env.ACTION)
        run: |
          {
            echo "BUCKET=$(terraform output -raw bucket)"
            echo "DATABASE=$(terraform output -raw database)"
            echo "WORKGROUP=$(terraform output -raw workgroup)"
            echo "GLUE_JOB=$(terraform output -raw glue_job)"
            echo "CRAWLER=$(terraform output -raw crawler)"
            echo "ANALYSIS_YEAR=$(terraform output -raw analysis_year)"
          } >> "$GITHUB_ENV"

      - name: "INGEST (extract + load): NHTSA files → raw zone"
        if: env.ACTION == 'ingest' || env.ACTION == 'all'
        run: python pipeline/ingest.py

      - name: "ELT: transform with SQL in Athena (CTAS → Parquet)"
        if: env.ACTION == 'elt' || env.ACTION == 'all'
        run: python pipeline/elt.py

      - name: "ETL: transform with Spark in Glue, then crawl"
        if: env.ACTION == 'etl' || env.ACTION == 'all'
        run: python pipeline/etl.py

      - name: Data quality checks (completeness, validity, uniqueness, ELT = ETL)
        if: env.ACTION == 'analyse' || env.ACTION == 'all'
        run: python pipeline/quality.py

      - name: Analysis + raw-vs-Parquet cost comparison
        if: env.ACTION == 'analyse' || env.ACTION == 'all'
        run: python pipeline/analyse.py

      - name: terraform destroy
        if: env.ACTION == 'destroy'
        run: terraform destroy -auto-approve -input=false
