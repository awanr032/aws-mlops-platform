name: foundation-check

# Run manually from the Actions tab to prove GitHub can reach AWS through OIDC.
on:
  workflow_dispatch:

permissions:
  id-token: write   # needed to request the OIDC token
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Show the identity GitHub is using
        run: aws sts get-caller-identity
